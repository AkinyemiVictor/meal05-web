<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f04e1f" />
    <title>Meal05 is offline</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172017;
        --muted: #64705f;
        --line: #d9dfd4;
        --paper: #fffaf3;
        --pepper: #f04e1f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          linear-gradient(135deg, rgba(240, 78, 31, 0.12), rgba(83, 132, 64, 0.12)),
          var(--paper);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 440px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.86);
        padding: 24px;
        box-shadow: 0 18px 45px rgba(23, 32, 23, 0.12);
      }

      img {
        display: block;
        width: 56px;
        height: 56px;
        object-fit: contain;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 1.55rem;
        line-height: 1.15;
      }

      p {
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        margin-top: 20px;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        border-radius: 6px;
        background: var(--pepper);
        color: #fff;
        padding: 0 16px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/favicon/android-chrome-192x192.png" alt="" />
      <h1>Meal05 needs a connection</h1>
      <p>Your device is offline. Reconnect to browse fresh groceries, update cart items, and complete checkout.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
