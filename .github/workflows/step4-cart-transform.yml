name: Apply Phase B Cart Step 4

on:
  push:
    branches:
      - feature/flexible-availability-phase-b
    paths:
      - scripts/phase-b-step4-cart-transform.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flexible-availability-phase-b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded cart transformation
        run: node scripts/phase-b-step4-cart-transform.mjs
      - name: Remove temporary transformer
        run: rm scripts/phase-b-step4-cart-transform.mjs .github/workflows/step4-cart-transform.yml
      - name: Commit Step 4 cart UX
        run: |
          git config user.name "Meal05 CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: clarify cart availability flow"
          git push origin HEAD:feature/flexible-availability-phase-b
