name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE }}
      SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
      SUPABASE_DB_DIRECT_URL: ${{ secrets.SUPABASE_DB_DIRECT_URL }}
      NEXT_PUBLIC_SUPABASE_PRODUCT_IMAGE_BUCKET: ${{ vars.NEXT_PUBLIC_SUPABASE_PRODUCT_IMAGE_BUCKET || secrets.NEXT_PUBLIC_SUPABASE_PRODUCT_IMAGE_BUCKET }}
      SUPABASE_PRODUCT_IMAGE_BUCKET: ${{ vars.SUPABASE_PRODUCT_IMAGE_BUCKET || secrets.SUPABASE_PRODUCT_IMAGE_BUCKET }}
      NEXT_PUBLIC_ADMIN_EMAILS: ${{ vars.NEXT_PUBLIC_ADMIN_EMAILS || secrets.NEXT_PUBLIC_ADMIN_EMAILS }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      NEXT_PUBLIC_CURRENCY_CODE: ${{ vars.NEXT_PUBLIC_CURRENCY_CODE || secrets.NEXT_PUBLIC_CURRENCY_CODE }}
      NEXT_PUBLIC_VARIANT_INACTIVE_STOCK_THRESHOLD: ${{ vars.NEXT_PUBLIC_VARIANT_INACTIVE_STOCK_THRESHOLD || secrets.NEXT_PUBLIC_VARIANT_INACTIVE_STOCK_THRESHOLD }}
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY || secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      NEXT_PUBLIC_ENABLE_OPAY: ${{ vars.NEXT_PUBLIC_ENABLE_OPAY || secrets.NEXT_PUBLIC_ENABLE_OPAY }}
      NEXT_PUBLIC_ENABLE_PALMPAY: ${{ vars.NEXT_PUBLIC_ENABLE_PALMPAY || secrets.NEXT_PUBLIC_ENABLE_PALMPAY }}
      PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_API_TOKEN: ${{ secrets.RESEND_API_TOKEN }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM || secrets.EMAIL_FROM }}
      EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME || secrets.EMAIL_FROM_NAME }}
      RECEIPT_FROM_EMAIL: ${{ vars.RECEIPT_FROM_EMAIL || secrets.RECEIPT_FROM_EMAIL }}
      RECEIPT_FROM_NAME: ${{ vars.RECEIPT_FROM_NAME || secrets.RECEIPT_FROM_NAME }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      ADMIN_ORDER_ALERT_EMAILS: ${{ secrets.ADMIN_ORDER_ALERT_EMAILS }}
      ORDER_ALERT_EMAILS: ${{ secrets.ORDER_ALERT_EMAILS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment env
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in GitHub secrets/variables"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy to Cloudflare
        run: npm run deploy

      - name: Purge deployed page cache
        if: ${{ env.CLOUDFLARE_ZONE_ID != '' }}
        run: |
          response="$(curl --silent --show-error --fail-with-body \
              --request POST \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"files":["https://meal05.com/","https://meal05.com/home","https://meal05.com/shop","https://www.meal05.com/","https://www.meal05.com/home","https://www.meal05.com/shop"]}')"
          RESPONSE="$response" node -e '
            const payload = JSON.parse(process.env.RESPONSE || "{}");
            if (!payload.success) {
              console.error("Cloudflare cache purge failed", payload.errors || payload);
              process.exit(1);
            }
            console.log("Purged cached public page HTML.");
          '
